<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1220"><title>SAM-SCANNER Pro</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--p:#10b981;--pd:#047857;--bg:#0b1220;--s:#172033;--s2:#263349;--t:#e2e8f0;--m:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none}
html,body{height:100%;background:var(--bg);color:var(--t);overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.scr.on{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--s);min-height:52px}
.bar h1{font-size:1rem;flex:1}.bar input{flex:1;min-width:0;background:none;border:0;color:#fff;font-size:.95rem;font-weight:600;outline:0}
.logo{background:var(--p);padding:3px 7px;border-radius:5px;font-size:.7rem;font-weight:800}
.b{background:var(--p);color:#fff;border:0;border-radius:22px;padding:10px 16px;font-weight:600;font-size:.85rem;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.b.sec{background:var(--s2);color:var(--t)}
.ib{background:none;border:0;color:#fff;font-size:1.3rem;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
#list{flex:1;overflow:auto;padding:12px 12px 90px;display:grid;gap:10px;align-content:start}
.card{display:flex;gap:12px;align-items:center;background:var(--s);border-radius:12px;padding:10px;cursor:pointer}
.card img{width:52px;height:68px;object-fit:cover;border-radius:6px;background:#fff}
.card div{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.card b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small,.empty{color:var(--m)}
.empty{text-align:center;margin-top:30vh}
.fab{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px}
.vp{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#05080f;min-height:0}
.vp video{width:100%;height:100%;object-fit:contain}
.vp canvas,.vp img{max-width:100%;max-height:100%}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.modes{flex:1;display:flex;gap:6px;overflow-x:auto}
.modes span{padding:6px 12px;border-radius:16px;font-size:.78rem;font-weight:600;color:var(--m);white-space:nowrap;cursor:pointer}
.modes span.on{background:var(--p);color:#fff}
.deck{display:flex;justify-content:space-around;align-items:center;padding:12px;background:var(--s)}
.shut{width:70px;height:70px;border-radius:50%;border:4px solid #fff;background:var(--p);background-clip:content-box;padding:5px;cursor:pointer}
#cth{width:46px;height:60px;border-radius:6px;background:var(--s2) center/cover;position:relative}
#cth i{position:absolute;top:-6px;right:-6px;background:var(--p);border-radius:10px;min-width:20px;text-align:center;font:700 .7rem sans-serif;padding:2px 5px}
.nav{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#000a;border-radius:20px;padding:2px 8px;font-size:.8rem}
.nav button{background:none;border:0;color:#fff;font-size:1.4rem;padding:2px 8px}
#strip{display:flex;gap:8px;padding:8px 10px;overflow-x:auto;background:#0f172a;min-height:76px}
#strip img{height:60px;width:46px;object-fit:cover;border:2px solid transparent;border-radius:4px;flex-shrink:0;background:#fff}
#strip img.on{border-color:var(--p)}
.sl{display:flex;gap:8px;align-items:center;padding:6px 12px;background:#101a2c;font-size:.8rem}
.sl input{flex:1;accent-color:var(--p)}
.row{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--s)}
.fc,.tl{flex:0 0 auto;background:var(--s2);color:var(--t);border:2px solid transparent;border-radius:10px;padding:8px 12px;font-size:.75rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.fc.on{border-color:var(--p);color:var(--p)}.tl span{font-size:1.15rem}
#cc{touch-action:none}
#mg{position:absolute;top:10px;left:10px;width:90px;height:90px;border-radius:50%;border:3px solid var(--p);display:none;background:#000}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--s);border-radius:16px 16px 0 0;padding:16px calc(16px) calc(16px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:10px;z-index:100;max-height:85%;overflow:auto;box-shadow:0 -8px 30px #000a}
.sheet.on{display:flex}.sheet h3{display:flex;justify-content:space-between;font-size:1rem}
.sheet select,.sheet input[type=text],.sheet input[type=password]{padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;width:100%;user-select:text}
.sheet label{font-size:.82rem;color:var(--m);display:flex;flex-direction:column;gap:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#sg{background:#fff;border-radius:8px;width:100%;height:150px;touch-action:none}
#ocrT{background:#0f172a;border-radius:8px;padding:10px;max-height:30vh;overflow:auto;white-space:pre-wrap;font-size:.85rem;user-select:text}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--pd);padding:8px 16px;border-radius:20px;font-size:.82rem;font-weight:600;display:none;z-index:300;max-width:90%;text-align:center}
</style></head><body>

<div id="home" class="scr on">
  <div class="bar"><b class="logo">PRO</b><h1>SAM-SCANNER</h1></div>
  <div id="list"></div>
  <div class="fab">
    <label class="b sec">🖼️ Import<input type="file" accept="image/*" multiple hidden onchange="imp(this)"></label>
    <button class="b" onclick="startScan()">📷 Scan</button>
  </div>
</div>

<div id="cam" class="scr">
  <div class="bar"><button class="ib" onclick="closeCam()">✕</button>
    <div class="modes" id="modes"><span class="on" data-m="doc">Document</span><span data-m="idcard">ID Card</span><span data-m="book">Book</span></div>
    <button class="ib" onclick="torch()">🔦</button></div>
  <div class="vp"><video id="vid" autoplay playsinline muted></video><canvas id="ov"></canvas><div id="fl"></div></div>
  <div class="deck">
    <div id="cth" onclick="edit()"></div>
    <button class="shut" onclick="shoot()"></button>
    <label class="ib">🖼️<input type="file" accept="image/*" multiple hidden onchange="imp(this)"></label>
  </div>
</div>

<div id="crop" class="scr">
  <div class="bar"><button class="b sec" onclick="edit()">Cancel</button><button class="b sec" onclick="cFull()">Full</button><button class="b sec" onclick="cAuto()">Auto</button><button class="b" onclick="cDone()">✓ Done</button></div>
  <div class="vp"><canvas id="cc"></canvas><canvas id="mg" width="100" height="100"></canvas></div>
</div>

<div id="edit" class="scr">
  <div class="bar"><button class="ib" onclick="home()">←</button><input id="title" onchange="rename()"><button class="b" onclick="openM('exp')">PDF ⤓</button></div>
  <div class="vp"><img id="pv"><div class="nav"><button onclick="go(-1)">‹</button><span id="pn"></span><button onclick="go(1)">›</button></div></div>
  <div id="strip"></div>
  <div class="sl">☀️<input id="br" type="range" min="-50" max="50" value="0" oninput="adj()" onchange="adj()">◐<input id="ctr" type="range" min="-50" max="50" value="0" oninput="adj()" onchange="adj()"></div>
  <div class="row">
    <button class="fc" data-f="magic" onclick="setF('magic')">Magic color</button>
    <button class="fc" data-f="orig" onclick="setF('orig')">Original</button>
    <button class="fc" data-f="light" onclick="setF('light')">Lighten</button>
    <button class="fc" data-f="bw" onclick="setF('bw')">B&amp;W</button>
    <button class="fc" data-f="gray" onclick="setF('gray')">Grayscale</button>
  </div>
  <div class="row">
    <button class="tl" onclick="recrop()"><span>✂️</span>Crop</button>
    <button class="tl" onclick="rot()"><span>↻</span>Rotate</button>
    <button class="tl" onclick="openM('sig')"><span>✍️</span>Sign</button>
    <button class="tl" onclick="openM('wm')"><span>🛡️</span>Watermark</button>
    <button class="tl" onclick="ocr()"><span>🔤</span>Text</button>
    <button class="tl" onclick="mv(-1)"><span>◀</span>Move</button>
    <button class="tl" onclick="mv(1)"><span>▶</span>Move</button>
    <button class="tl" onclick="openCam()"><span>➕</span>Add</button>
    <button class="tl" onclick="delPage()"><span>🗑️</span>Delete</button>
  </div>
</div>

<div class="sheet" id="exp"><h3>Save as PDF <button class="ib" onclick="closeM('exp')">✕</button></h3>
  <label>Page size<select id="fmt"><option value="a4">A4 (print ready)</option><option value="fit">Fit to page</option></select></label>
  <label>Quality<select id="qual"><option value="0.95">High</option><option value="0.8" selected>Balanced</option><option value="0.6">Small file</option></select></label>
  <label>Password (optional)<input type="password" id="pw" placeholder="Leave empty for none"></label>
  <div class="acts"><button class="b sec" onclick="pdf(true)">Share</button><button class="b" onclick="pdf(false)">Save PDF</button></div></div>

<div class="sheet" id="sig"><h3>Signature <button class="ib" onclick="closeM('sig')">✕</button></h3>
  <div style="display:flex;gap:12px;align-items:center"><span style="font-size:.8rem">Ink</span>
    <button class="ib" style="font-size:1.6rem" onclick="sc='#000'">⚫</button><button class="ib" style="font-size:1.6rem" onclick="sc='#1d4ed8'">🔵</button><button class="ib" style="font-size:1.6rem" onclick="sc='#b91c1c'">🔴</button></div>
  <canvas id="sg"></canvas>
  <div class="acts"><button class="b sec" onclick="sx.clearRect(0,0,sg.width,sg.height)">Clear</button><button class="b" onclick="stampSig()">Add signature</button></div></div>

<div class="sheet" id="wm"><h3>Watermark <button class="ib" onclick="closeM('wm')">✕</button></h3>
  <input type="text" id="wmT" value="CONFIDENTIAL"><label>Opacity<input type="range" id="wmO" min="10" max="80" value="25"></label>
  <div class="acts"><button class="b" onclick="stampWm()">Apply to this page</button></div></div>

<div class="sheet" id="ocr"><h3>Text from page <button class="ib" onclick="closeM('ocr')">✕</button></h3>
  <div id="ocrT"></div>
  <label>Language<select id="lang" onchange="ocr()"><option value="eng">English</option><option value="urd">Urdu</option><option value="ara">Arabic</option></select></label>
  <label>Translate to<select onchange="tr(this.value)"><option value="">Select…</option><option value="ur">Urdu</option><option value="ar">Arabic</option><option value="en">English</option><option value="fr">French</option><option value="es">Spanish</option></select></label>
  <div class="acts"><button class="b sec" onclick="exp('copy')">Copy</button><button class="b sec" onclick="exp('doc')">Word</button><button class="b sec" onclick="exp('csv')">Excel</button><button class="b" onclick="exp('txt')">.txt</button></div></div>

<div id="toast"></div>

<script>
const $=id=>document.getElementById(id),MAXW=2000;
let doc=null,idx=0,mode='doc',stream=null,timer=null,idFront=null,crop=null,tOn=false;
const cur=()=>doc.pages[idx];
const load=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u});
const box=(c,m=0)=>{const w=c.width,h=c.height,a=w*m,b=h*m;return[{x:a,y:b},{x:w-a,y:b},{x:w-a,y:h-b},{x:a,y:h-b}]};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)}
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id))}
function openM(id){$(id).classList.add('on');if(id==='sig'){sg.width=sg.offsetWidth;sg.height=150}}
const closeM=id=>$(id).classList.remove('on');

/* ---------- Library (IndexedDB) ---------- */
const db=new Promise((ok,no)=>{const r=indexedDB.open('sam-scanner',1);r.onupgradeneeded=()=>r.result.createObjectStore('d',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,no)=>{const t=d.transaction('d',m),q=f(t.objectStore('d'));t.oncomplete=()=>ok(q&&q.result);t.onerror=no})};
const dbAll=()=>tx('readonly',s=>s.getAll()),dbPut=d=>tx('readwrite',s=>s.put(d)),dbDel=id=>tx('readwrite',s=>s.delete(id));
const save=()=>{doc.ts=Date.now();return dbPut(doc)};
const newDoc=()=>({id:Date.now(),name:'Scan '+new Date().toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}),ts:Date.now(),pages:[]});

async function home(){stopCam();doc=null;show('home');const l=(await dbAll()).sort((a,b)=>b.ts-a.ts),L=$('list');
  L.innerHTML=l.length?'':'<p class="empty">No scans yet.<br>Tap Scan to capture your first document.</p>';
  l.forEach(d=>{const e=document.createElement('div');e.className='card';
    e.innerHTML='<img><div><b></b><small></small></div><button class="ib">🗑️</button>';
    e.querySelector('img').src=d.pages[0]?d.pages[0].out:'';e.querySelector('b').textContent=d.name;
    e.querySelector('small').textContent=d.pages.length+' page(s) · '+new Date(d.ts).toLocaleDateString();
    e.onclick=()=>{doc=d;idx=0;edit()};
    e.querySelector('button').onclick=async ev=>{ev.stopPropagation();if(confirm('Delete "'+d.name+'"?')){await dbDel(d.id);home()}};
    L.append(e)})}

/* ---------- Camera ---------- */
function startScan(){doc=null;idFront=null;openCam()}
async function openCam(){if(!doc)doc=newDoc();show('cam');updCount();
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}});
    $('vid').srcObject=stream;timer=setInterval(liveDetect,500)}
  catch(e){toast('Camera blocked — use Import (🖼️) to pick a photo')}}
function stopCam(){clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;tOn=false}
function closeCam(){stopCam();doc&&doc.pages.length?edit():home()}
async function torch(){try{tOn=!tOn;await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:tOn}]})}catch{toast('Torch not supported')}}
$('modes').onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;idFront=null;[...$('modes').children].forEach(s=>s.classList.toggle('on',s===e.target));
  toast({doc:'Document',idcard:'ID card: capture FRONT, then BACK',book:'Book: capture the open 2-page spread'}[m])};
function updCount(){const n=doc?doc.pages.length:0,t=$('cth');t.style.backgroundImage=n?`url(${doc.pages[n-1].out})`:'none';t.innerHTML=n?`<i>${n}</i>`:''}

const dc=document.createElement('canvas');
function detect(src,w,h){try{const s=Math.min(1,320/Math.max(w,h)),sw=Math.round(w*s),sh=Math.round(h*s);dc.width=sw;dc.height=sh;
  const x=dc.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,sw,sh);const d=x.getImageData(0,0,sw,sh).data,g=new Uint8Array(sw*sh);let t=0;
  for(let i=0;i<g.length;i++){g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];t+=g[i]}
  const avg=t/g.length;let bl=0,bc=0;
  for(let a=0;a<sw;a++){bl+=g[a]+g[(sh-1)*sw+a];bc+=2}for(let b=0;b<sh;b++){bl+=g[b*sw]+g[b*sw+sw-1];bc+=2}
  const bg=bl/bc;if(Math.abs(avg-bg)<18)return null;const light=avg>=bg,th=(avg+bg)/2;
  let mn=1e9,mx=-1e9,dn=1e9,dx=-1e9,tl,tr,br,bL,n=0;
  for(let y=0;y<sh;y++)for(let x2=0;x2<sw;x2++){const v=g[y*sw+x2];if(light?v>th:v<th){n++;const a=x2+y,b=x2-y;
    if(a<mn){mn=a;tl={x:x2,y}}if(a>mx){mx=a;br={x:x2,y}}if(b>dx){dx=b;tr={x:x2,y}}if(b<dn){dn=b;bL={x:x2,y}}}}
  if(n<sw*sh*.25||n>sw*sh*.92)return null;
  const q=[tl,tr,br,bL].map(p=>({x:p.x/s,y:p.y/s})),H=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),A=H(q[0],q[1]),B=H(q[3],q[2]);
  return Math.abs(A-B)/Math.max(A,B)<.35?q:null}catch{return null}}
function liveDetect(){const v=$('vid');if(!v.videoWidth)return;const c=$('ov'),W=c.width=v.clientWidth,H=c.height=v.clientHeight,x=c.getContext('2d'),
  s=Math.min(W/v.videoWidth,H/v.videoHeight),ox=(W-v.videoWidth*s)/2,oy=(H-v.videoHeight*s)/2,p=detect(v,v.videoWidth,v.videoHeight);
  x.clearRect(0,0,W,H);if(!p)return;x.beginPath();p.forEach((q,i)=>x[i?'lineTo':'moveTo'](ox+q.x*s,oy+q.y*s));x.closePath();
  x.fillStyle='rgba(16,185,129,.22)';x.fill();x.strokeStyle='#10b981';x.lineWidth=3;x.stroke()}

function fit(src,w,h){const s=Math.min(1,MAXW/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c}
async function shoot(){const v=$('vid');if(!stream||!v.videoWidth)return toast('Camera not ready — use Import');
  $('fl').style.opacity=.8;setTimeout(()=>$('fl').style.opacity=0,120);await handle(fit(v,v.videoWidth,v.videoHeight))}
async function imp(i){const fs=[...i.files];i.value='';if(!fs.length)return;toast('Processing…');if(!doc)doc=newDoc();
  for(const f of fs){const b=await createImageBitmap(f);await handle(fit(b,b.width,b.height))}
  $('cam').classList.contains('on')?updCount():doc.pages.length&&edit()}

async function handle(c){
  if(mode==='book'){const h=c.width>>1;for(const x of[0,h]){const p=document.createElement('canvas');p.width=h;p.height=c.height;p.getContext('2d').drawImage(c,x,0,h,c.height,0,0,h,c.height);await addPage(p)}return}
  if(mode==='idcard'){const p=warp(c,detect(c,c.width,c.height)||box(c,.03));
    if(!idFront){idFront=p;return toast('Front saved — now capture the BACK')}
    const f=idFront,A=document.createElement('canvas');idFront=null;A.width=1240;A.height=1754;const x=A.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1240,1754);
    [f,p].forEach((im,i)=>{const s=Math.min(900/im.width,560/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,170+(900-w)/2,150+i*820+(560-h)/2,w,h)});
    return addPage(A,true)}
  await addPage(c)}
async function addPage(raw,full){const pts=full?box(raw):(detect(raw,raw.width,raw.height)||box(raw,.03));
  const p={raw:raw.toDataURL('image/jpeg',.85),pts,filter:'magic',br:0,ct:0,src:warp(raw,pts).toDataURL('image/jpeg',.92)};
  await render(p);doc.pages.push(p);idx=doc.pages.length-1;await save();updCount();toast('Page '+doc.pages.length+' added')}

/* ---------- Perspective crop ---------- */
function warp(c,q){const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),W=Math.max(50,Math.round(Math.max(D(q[0],q[1]),D(q[3],q[2])))),H=Math.max(50,Math.round(Math.max(D(q[0],q[3]),D(q[1],q[2]))));
  const[p0,p1,p2,p3]=q,dx1=p1.x-p2.x,dx2=p3.x-p2.x,dx3=p0.x-p1.x+p2.x-p3.x,dy1=p1.y-p2.y,dy2=p3.y-p2.y,dy3=p0.y-p1.y+p2.y-p3.y,det=dx1*dy2-dx2*dy1;
  let g=0,h=0;if(Math.abs(det)>1e-6){g=(dx3*dy2-dx2*dy3)/det;h=(dx1*dy3-dx3*dy1)/det}
  const a=p1.x-p0.x+g*p1.x,b=p3.x-p0.x+h*p3.x,d=p1.y-p0.y+g*p1.y,e=p3.y-p0.y+h*p3.y;
  const sw=c.width,sh=c.height,S=c.getContext('2d').getImageData(0,0,sw,sh).data,o=document.createElement('canvas');o.width=W;o.height=H;
  const ox=o.getContext('2d'),O=ox.createImageData(W,H),R=O.data;
  for(let y=0;y<H;y++){const v=y/H;for(let x=0;x<W;x++){const u=x/W,k=g*u+h*v+1,
    X=Math.min(sw-1.001,Math.max(0,(a*u+b*v+p0.x)/k)),Y=Math.min(sh-1.001,Math.max(0,(d*u+e*v+p0.y)/k)),
    x0=X|0,y0=Y|0,fx=X-x0,fy=Y-y0,i=(y0*sw+x0)*4,j=i+sw*4,n=(y*W+x)*4;
    for(let t=0;t<3;t++)R[n+t]=(S[i+t]*(1-fx)+S[i+4+t]*fx)*(1-fy)+(S[j+t]*(1-fx)+S[j+4+t]*fx)*fy;R[n+3]=255}}
  ox.putImageData(O,0,0);return o}

/* ---------- Filters (shadow removal + adaptive) ---------- */
function background(d,w,h){const B=Math.max(12,Math.round(Math.max(w,h)/48)),bw=Math.ceil(w/B),bh=Math.ceil(h/B),m=new Uint8ClampedArray(bw*bh*4);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,k=((y/B|0)*bw+(x/B|0))*4;for(let t=0;t<3;t++)if(d[i+t]>m[k+t])m[k+t]=d[i+t]}
  for(let k=0;k<m.length;k+=4){for(let t=0;t<3;t++)m[k+t]=Math.max(110,m[k+t]);m[k+3]=255}
  const s=document.createElement('canvas');s.width=bw;s.height=bh;s.getContext('2d').putImageData(new ImageData(m,bw,bh),0,0);
  const o=document.createElement('canvas');o.width=w;o.height=h;const x=o.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(s,0,0,w,h);return x.getImageData(0,0,w,h).data}
function process(im,f,br,ct){const w=im.width,h=im.height,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0);
  if(f==='orig'&&!br&&!ct)return c;const I=x.getImageData(0,0,w,h),d=I.data,bg=(f==='orig'||f==='light')?null:background(d,w,h),
  fc=(259*(ct*2+255))/(255*(259-ct*2)),Bv=br*2,L=new Uint8Array(256);
  for(let v=0;v<256;v++){let r=v;
    if(f==='magic')r=255*Math.pow(v/255,1.7);else if(f==='gray')r=255*Math.pow(v/255,1.3);else if(f==='light')r=255*Math.pow(v/255,.6);
    L[v]=f==='bw'?(v<170-Bv?0:255):Math.max(0,Math.min(255,fc*(r-128)+128+Bv))}
  for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],b=d[i+2];
    if(bg){r=Math.min(255,r*255/bg[i]);g=Math.min(255,g*255/bg[i+1]);b=Math.min(255,b*255/bg[i+2])}
    if(f==='gray'||f==='bw')r=g=b=.299*r+.587*g+.114*b;
    d[i]=L[r|0];d[i+1]=L[g|0];d[i+2]=L[b|0]}
  x.putImageData(I,0,0);return c}
async function render(p){p.out=process(await load(p.src),p.filter,p.br,p.ct).toDataURL('image/jpeg',.9)}

/* ---------- Editor ---------- */
function edit(){stopCam();show('edit');$('title').value=doc.name;view()}
function view(){const n=doc.pages.length;if(!n){$('pv').removeAttribute('src');$('pn').textContent='0 / 0';$('strip').innerHTML='';return}
  idx=Math.max(0,Math.min(n-1,idx));const p=cur();$('pv').src=p.out;$('pn').textContent=`${idx+1} / ${n}`;$('br').value=p.br;$('ctr').value=p.ct;
  document.querySelectorAll('.fc').forEach(e=>e.classList.toggle('on',e.dataset.f===p.filter));
  const S=$('strip');S.innerHTML='';doc.pages.forEach((q,i)=>{const im=document.createElement('img');im.src=q.out;im.className=i===idx?'on':'';im.onclick=()=>{idx=i;view()};S.append(im)});
  S.children[idx]&&S.children[idx].scrollIntoView({inline:'center',block:'nearest'})}
const go=d=>{idx+=d;view()};
const rename=()=>{doc.name=$('title').value||doc.name;save()};
async function setF(f){const p=cur();p.filter=f;p.br=p.ct=0;await render(p);view();save()}
let busy=false,again=false;
async function adj(){if(busy){again=true;return}busy=true;do{again=false;const p=cur();p.br=+$('br').value;p.ct=+$('ctr').value;await render(p);$('pv').src=p.out}while(again);busy=false;save()}
async function mv(d){const j=idx+d;if(j<0||j>=doc.pages.length)return;[doc.pages[idx],doc.pages[j]]=[doc.pages[j],doc.pages[idx]];idx=j;view();save()}
async function delPage(){if(!doc.pages.length||!confirm('Delete this page?'))return;doc.pages.splice(idx,1);
  if(!doc.pages.length){await dbDel(doc.id);return home()}view();save()}
const rc=im=>{const c=document.createElement('canvas');c.width=im.height;c.height=im.width;const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);x.drawImage(im,-im.width/2,-im.height/2);return c.toDataURL('image/jpeg',.92)};
async function rot(){const p=cur(),[r,s]=await Promise.all([load(p.raw),load(p.src)]),H=r.height,m=p.pts.map(q=>({x:H-q.y,y:q.x}));
  p.pts=[m[3],m[0],m[1],m[2]];p.raw=rc(r);p.src=rc(s);await render(p);view();save()}
async function stamp(fn){const p=cur(),im=await load(p.src),c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);fn(x,c);
  p.src=c.toDataURL('image/jpeg',.92);await render(p);view();save()}

/* crop editor */
const cc=$('cc'),mg=$('mg');let di=-1,lp=null;
const hs=()=>{const p=crop.pts;return[...p,...p.map((q,i)=>({x:(q.x+p[(i+1)%4].x)/2,y:(q.y+p[(i+1)%4].y)/2}))]};
function drawCrop(){const x=cc.getContext('2d'),P=crop.pts,R=cc.width/40;x.drawImage(crop.im,0,0);x.beginPath();P.forEach((q,i)=>x[i?'lineTo':'moveTo'](q.x,q.y));x.closePath();
  x.fillStyle='rgba(16,185,129,.2)';x.fill();x.lineWidth=R/5;x.strokeStyle='#10b981';x.stroke();hs().forEach(q=>{x.beginPath();x.arc(q.x,q.y,R,0,7);x.fillStyle='#fff';x.fill();x.stroke()})}
async function recrop(){const p=cur();crop={im:await load(p.raw),pts:p.pts.map(q=>({...q}))};cc.width=crop.im.width;cc.height=crop.im.height;show('crop');drawCrop()}
const cFull=()=>{crop.pts=box(crop.im);drawCrop()},cAuto=()=>{crop.pts=detect(crop.im,crop.im.width,crop.im.height)||box(crop.im,.03);drawCrop()};
async function cDone(){const p=cur();p.pts=crop.pts;p.src=warp(crop.im,crop.pts).toDataURL('image/jpeg',.92);await render(p);edit();save()}
const pos=e=>{const r=cc.getBoundingClientRect();return{x:(e.clientX-r.left)*cc.width/r.width,y:(e.clientY-r.top)*cc.height/r.height}};
cc.onpointerdown=e=>{if(!crop)return;const p=pos(e);let best=cc.width/40*3;di=-1;hs().forEach((q,i)=>{const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<best){best=d;di=i}});
  if(di>=0){cc.setPointerCapture(e.pointerId);lp=p;mg.style.display='block'}};
cc.onpointermove=e=>{if(di<0)return;const p=pos(e),P=crop.pts,dx=p.x-lp.x,dy=p.y-lp.y,cl=q=>{q.x=Math.max(0,Math.min(cc.width,q.x+dx));q.y=Math.max(0,Math.min(cc.height,q.y+dy))};
  if(di<4)cl(P[di]);else{cl(P[di-4]);cl(P[(di-3)%4])}lp=p;drawCrop();const q=hs()[di],s=cc.width/12;mg.getContext('2d').drawImage(cc,q.x-s/2,q.y-s/2,s,s,0,0,100,100)};
cc.onpointerup=cc.onpointercancel=()=>{di=-1;mg.style.display='none'};

/* signature + watermark */
const sg=$('sg'),sx=sg.getContext('2d');let sd=false,sc='#000';
const sp=e=>{const r=sg.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
sg.onpointerdown=e=>{sd=true;sg.setPointerCapture(e.pointerId);sx.beginPath();sx.moveTo(...sp(e));sx.strokeStyle=sc;sx.lineWidth=3;sx.lineCap='round'};
sg.onpointermove=e=>{if(sd){sx.lineTo(...sp(e));sx.stroke()}};sg.onpointerup=()=>sd=false;
async function stampSig(){const im=await load(sg.toDataURL('image/png'));closeM('sig');
  await stamp((x,c)=>{const w=c.width*.35,h=w*im.height/im.width;x.drawImage(im,c.width-w-30,c.height-h-30,w,h)});toast('Signature added')}
async function stampWm(){const t=$('wmT').value||'CONFIDENTIAL',o=$('wmO').value/100;closeM('wm');
  await stamp((x,c)=>{x.translate(c.width/2,c.height/2);x.rotate(-Math.PI/4);x.font=`bold ${c.width/9|0}px sans-serif`;x.fillStyle=`rgba(220,38,38,${o})`;x.textAlign='center';x.fillText(t,0,0)});toast('Watermark applied')}

/* ---------- Text (OCR) + exports ---------- */
const loadJS=u=>new Promise((ok,no)=>{if(window.Tesseract)return ok();const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.append(s)});
async function ocr(){openM('ocr');const t=$('ocrT');t.textContent='Reading text…';
  try{await loadJS('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');const w=await Tesseract.createWorker($('lang').value),r=await w.recognize(cur().out);
    t.textContent=r.data.text.trim()||'No text found on this page.';await w.terminate()}catch(e){t.textContent='Could not read text: '+(e.message||'check your connection')}}
async function tr(l){if(!l)return;toast('Translating…');try{const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${l}&dt=t&q=${encodeURIComponent($('ocrT').textContent)}`);
  $('ocrT').textContent=(await r.json())[0].map(i=>i[0]).join('')}catch{toast('Translation failed')}}
const dl=(n,b)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5e3)};
const N=()=>doc.name.replace(/[^\w\- ]+/g,'')||'scan';
function exp(k){const t=$('ocrT').textContent;
  if(k==='txt')dl(N()+'.txt',new Blob([t]));
  if(k==='doc')dl(N()+'.doc',new Blob(['\ufeff<html><head><meta charset="utf-8"></head><body><div style="font:12pt Calibri;white-space:pre-wrap">'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div></body></html>'],{type:'application/msword'}));
  if(k==='csv')dl(N()+'.csv',new Blob(['\ufeff'+t.split('\n').map(l=>l.trim().split(/\s{2,}|\t|,/).map(c=>'"'+c.replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));
  if(k==='copy')navigator.clipboard.writeText(t).then(()=>toast('Copied'))}

async function pdf(share){closeM('exp');if(!doc.pages.length)return toast('Scan a page first');toast('Building PDF…');
  const{jsPDF}=window.jspdf,a4=$('fmt').value==='a4',q=+$('qual').value,pw=$('pw').value;let P;
  for(const[i,p]of doc.pages.entries()){const im=await load(p.out),w=im.width,h=im.height,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0);
    const d=c.toDataURL('image/jpeg',q),o=w>h?'l':'p',f=a4?[210,297]:[Math.min(w,h)*.2646,Math.max(w,h)*.2646];
    if(!i)P=new jsPDF({orientation:o,unit:'mm',format:f,compress:true,encryption:pw?{userPassword:pw,ownerPassword:pw,userPermissions:['print','copy']}:undefined});else P.addPage(f,o);
    const W=P.internal.pageSize.getWidth(),H=P.internal.pageSize.getHeight(),s=Math.min(W/w,H/h);P.addImage(d,'JPEG',(W-w*s)/2,(H-h*s)/2,w*s,h*s,undefined,'FAST')}
  const b=P.output('blob'),n=N()+'.pdf',f=new File([b],n,{type:'application/pdf'});
  if(share&&navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:doc.name}).catch(()=>{});else dl(n,b)}

home();
</script></body></html>
